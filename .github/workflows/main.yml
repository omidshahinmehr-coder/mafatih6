name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs/uses a matching Gradle CLI directly, so the repo does not
      # need to ship the binary gradle-wrapper.jar to be buildable on CI.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
        working-directory: ./

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mafatih-debug-apk
          path: app/build/outputs/apk/debug/*.apk
